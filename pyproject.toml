[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "polarity"
version = "1.0.0"
description = "Parses classification expressions into an AST and extracts keywords with sound inclusion/exclusion polarity, with a semantic diff between two versions"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "click>=8.1",
    "pydantic>=2.0",
    "pydantic-settings>=2.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
bedrock = ["boto3>=1.34"]
vertex = ["google-cloud-aiplatform>=1.50"]
excel = ["openpyxl>=3.1"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "openpyxl>=3.1",
]

[project.scripts]
polarity = "key_extract.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/key_extract"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "B", "UP"]

[tool.pytest.ini_options]
testpaths = ["tests"]
